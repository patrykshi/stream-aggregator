services:
  stream-aggregator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stream-aggregator
    restart: unless-stopped
    ports:
      - "${PORT:-7001}:7001"
    environment:
      - PORT=7001
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

