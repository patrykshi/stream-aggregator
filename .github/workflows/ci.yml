name: Nuvio Hub - Tests and Docker
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: bash -n scripts/deploy-verified.sh scripts/backup-verify.sh
      - run: npm test
      - run: docker build --tag nuvio-hub:ci .
      - run: docker run --rm --entrypoint sh nuvio-hub:ci -c 'test -r /app/src/server.js && test -r /app/public/index.html && node --check /app/src/server.js'
      - run: docker run --rm --entrypoint sh nuvio-hub:ci -c 'python3 -c "from PIL import Image; import ast; ast.parse(open(\"/app/python-cover/bridge.py\").read())"'
