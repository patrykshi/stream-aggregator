<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a111e">
<meta name="description" content="Nuvio Hub: seus addons, catálogos, coleções e fontes num só lugar.">
<title>Nuvio Hub — Agregador & Coleções</title>
<link rel="stylesheet" href="/styles.css">
<script defer src="/collection-links.js"></script>
<script defer src="/preview-data.js"></script>
<script defer src="/nuvio-preview.js"></script>
<script defer src="/app.js"></script>
<script defer src="/ui-selects.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="Nuvio Hub"><span class="brand-mark">N</span>
      <span><strong>NUVIO<span class="brand-accent">HUB</span></strong><small>Agregador + Collection Studio</small></span>
    </a>
    <div class="nav-label">ESPAÇO DE TRABALHO</div>
    <nav id="nav" aria-label="Navegação principal">
      <button data-view="overview"><span class="nav-icon">◫</span> Visão geral</button>
      <button data-view="addons"><span class="nav-icon">▦</span> Addons <span id="navAddonCount" class="nav-count">—</span></button>
      <button data-view="catalogs"><span class="nav-icon">▤</span> Catálogos <span id="navCatalogCount" class="nav-count">—</span></button>
      <button data-view="collections"><span class="nav-icon">▣</span> Coleções <span id="navCollectionCount" class="nav-count">—</span></button>
      <button data-view="monitor"><span class="nav-icon">◷</span> Monitoramento</button>
      <button data-view="publish"><span class="nav-icon">↗</span> Publicar no Nuvio</button>
      <button data-view="settings"><span class="nav-icon">⚙</span> Configurações</button>
    </nav>
    <div class="sidebar-note">
      <span class="indicator"></span><strong>Seu espaço, uma biblioteca</strong>
      <p>Catálogos e coleções usam os mesmos addons configurados no Agregador.</p>
    </div>
    <div class="sidebar-bottom"><span id="editAccess" class="access">Verificando acesso...</span><span>Nuvio Hub • Local first</span></div>
  </aside>

  <div class="main-shell">
    <header class="topbar">
      <div class="breadcrumbs"><span class="muted">Espaço de trabalho</span><span class="crumb-sep">/</span><b id="viewLabel">Visão geral</b></div>
      <div class="top-actions">
        <span id="saveHint" class="save-hint"></span>
        <button id="saveButton" type="button" class="btn btn-primary" disabled>Salvar alterações</button>
        <button id="reloadButton" type="button" class="btn btn-ghost" aria-label="Recarregar informações">↻</button>
      </div>
    </header>
    <div class="workspace" id="workspace">
      <section id="app" aria-live="polite"><div class="loading"><span class="spinner"></span> Carregando seu espaço de trabalho...</div></section>
    </div>
  </div>
</div>

<div id="modal" class="modal-backdrop" hidden aria-hidden="true">
 <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
   <div class="modal-head"><h2 id="modalTitle">Editor</h2><button id="modalClose" class="icon-button" type="button" aria-label="Fechar">✕</button></div>
   <div id="modalContent" class="modal-content"></div>
   <div id="modalActions" class="modal-actions"></div>
 </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
